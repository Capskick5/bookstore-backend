# BookVerse — Infrastructure (local dev)
# Chạy: docker compose -f infra/docker-compose.yml up -d
# Tắt:  docker compose -f infra/docker-compose.yml down
# Tắt + xóa data: docker compose -f infra/docker-compose.yml down -v

services:
  # ===== PostgreSQL — dữ liệu nghiệp vụ của Spring Boot =====
  postgres:
    image: postgres:16-alpine
    container_name: bookverse-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bookverse}
      POSTGRES_USER: ${POSTGRES_USER:-bookverse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bookverse}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bookverse}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===== Qdrant — vector store cho RAG (P5) =====
  qdrant:
    image: qdrant/qdrant:latest
    container_name: bookverse-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"   # REST API
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_data:/qdrant/storage

  # ===== MongoDB — lưu chunk/ảnh của RAG (nội bộ) =====
  mongo:
    image: mongo:7
    container_name: bookverse-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  # ===== Mongo Express — UI xem dữ liệu Mongo (tùy chọn, dev only) =====
  mongo-express:
    image: mongo-express:latest
    container_name: bookverse-mongo-express
    restart: unless-stopped
    depends_on:
      - mongo
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_SERVER: mongo
      ME_CONFIG_MONGODB_PORT: "27017"
      ME_CONFIG_BASICAUTH: "false"
    profiles: ["dev-tools"]   # chỉ chạy khi: docker compose --profile dev-tools up

volumes:
  postgres_data:
  qdrant_data:
  mongo_data:
