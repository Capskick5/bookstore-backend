name: CI Build & Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
          cache-dependency-path: bookstore/pom.xml

      - name: Check if Maven project exists
        id: check_pom
        run: |
          if [ -f "backend/pom.xml" ]; then
            echo "has_pom=true" >> $GITHUB_OUTPUT
          else
            echo "has_pom=false" >> $GITHUB_OUTPUT
            echo "pom.xml not found. Skipping Maven build."
          fi

      - name: Build and Test with Maven
        if: steps.check_pom.outputs.has_pom == 'true'
        run: mvn -B clean test
        working-directory: bookstore
