spring:
  application:
    name: bookstore
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/bookverse}
    username: ${SPRING_DATASOURCE_USERNAME:bookverse}
    password: ${SPRING_DATASOURCE_PASSWORD:bookverse}
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1.0
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

logging:
  level:
    org.springframework.security: DEBUG

jwt:
  secret: ${JWT_SECRET:wahwahwahwahwahwahwahwahwahwahwahwah}
  expiration: 900000
  refresh-expiration: 604800000

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  order:
    stock-hold-minutes: ${APP_ORDER_STOCK_HOLD_MINUTES:15}
    shipping-fee: ${APP_ORDER_SHIPPING_FEE:30000}
    free-shipping-threshold: ${APP_ORDER_FREE_SHIPPING_THRESHOLD:300000}
    timeout-check-ms: ${APP_ORDER_TIMEOUT_CHECK_MS:60000}
  payment:
    provider: ${APP_PAYMENT_PROVIDER:mock}
    mock:
      base-url: ${APP_PAYMENT_MOCK_BASE_URL:http://localhost:8080}
      signing-secret: ${APP_PAYMENT_MOCK_SIGNING_SECRET:mock-secret}
    payos:
      client-id: ${PAYOS_CLIENT_ID:}
      api-key: ${PAYOS_API_KEY:}
      checksum-key: ${PAYOS_CHECKSUM_KEY:}
      cancel-url: ${APP_PAYMENT_PAYOS_CANCEL_URL:http://localhost:3000/payment/cancel}
  rag:
    base-url: ${APP_RAG_BASE_URL:http://localhost:8000}
    timeout-ms: ${APP_RAG_TIMEOUT_MS:15000}
    enabled: ${APP_RAG_ENABLED:true}
    reconciliation-cron: ${APP_RAG_RECONCILIATION_CRON:0 0 2 * * ?}
  ai:
    rate-limit-per-minute: ${APP_AI_RATE_LIMIT_PER_MINUTE:20}
  cloudinary:
    cloud-name: ${CLOUDINARY_CLOUD_NAME:}
    api-key: ${CLOUDINARY_API_KEY:}
    api-secret: ${CLOUDINARY_API_SECRET:}
