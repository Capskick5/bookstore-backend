spring:
  application:
    name: bookstore
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/bookverse}
    username: ${SPRING_DATASOURCE_USERNAME:bookverse}
    password: ${SPRING_DATASOURCE_PASSWORD:bookverse}
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1.0

logging:
  level:
    org.springframework.security: DEBUG

jwt:
  secret: ${JWT_SECRET:wahwahwahwahwahwahwahwahwahwahwahwah}
  expiration: 900000 # 15 minutes in milliseconds
  refresh-expiration: 604800000

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}