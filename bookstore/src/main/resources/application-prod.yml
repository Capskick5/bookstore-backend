spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}

jwt:
  secret: ${JWT_SECRET}

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS}
  payment:
    provider: ${APP_PAYMENT_PROVIDER}
    mock:
      signing-secret: ${APP_PAYMENT_MOCK_SIGNING_SECRET}
  rag:
    base-url: ${APP_RAG_BASE_URL}
    enabled: ${APP_RAG_ENABLED:true}
  cloudinary:
    cloud-name: ${CLOUDINARY_CLOUD_NAME:}
    api-key: ${CLOUDINARY_API_KEY:}
    api-secret: ${CLOUDINARY_API_SECRET:}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  level:
    org.springframework.security: WARN
    edu.fpt.sba301.bookstore: INFO
